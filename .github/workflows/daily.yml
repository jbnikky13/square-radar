name: SquareRadar Daily

on:
  schedule:
    - cron: "30 5 * * 1-6"
    - cron: "30 12 * * 1-6"
    - cron: "30 18 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run SquareRadar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: npm start

      - name: Persist story history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story-history.json
          if git diff --cached --quiet; then
            echo "No story history changes to commit."
          else
            git commit -m "Update SquareRadar story history"
            git push
          fi
